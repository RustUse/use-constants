[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["RustUse Contributors"]
categories = ["algorithms", "mathematics", "rust-patterns", "science"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustUse/use-constants"
rust-version = "1.95.0"

[workspace.dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
use-astronomical-constants = { version = "0.2.0", path = "crates/use-astronomical-constants" }
use-chemical-constants = { version = "0.2.0", path = "crates/use-chemical-constants" }
use-computing-constants = { version = "0.2.0", path = "crates/use-computing-constants" }
use-earth-constants = { version = "0.2.0", path = "crates/use-earth-constants" }
use-math-constants = { version = "0.2.0", path = "crates/use-math-constants" }
use-physical-constants = { version = "0.2.0", path = "crates/use-physical-constants" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
